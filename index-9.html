<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hitech World - Product Catalog</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#17233b}header{background:#1260d2;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}main,.login{max-width:900px;margin:auto;padding:20px}.box,.product,.checkout{background:white;padding:20px;margin:15px 0;border-radius:16px;box-shadow:0 3px 15px #0001}input{width:100%;padding:13px;margin:6px 0;border:1px solid #ccd4e0;border-radius:10px;box-sizing:border-box}button{background:#1260d2;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:bold}.full{width:100%;margin-top:8px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}.product{text-align:center}.icon{font-size:45px}.qty{display:flex;justify-content:center;gap:18px;align-items:center;margin-top:15px}.line{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid #eee}.msg{background:#eef5ff;padding:10px;margin-top:10px;border-radius:8px}.hidden{display:none}footer{text-align:center;padding:25px;color:#68758a}
</style></head>
<body>
<header><b>HITECH WORLD</b><span>📞 8226015555</span></header>
<section id="login" class="login"><div class="box"><h2>Customer Login</h2><p>Enter your 10-digit mobile number.</p><input id="mobile" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"><button class="full" onclick="login()">Continue</button><div id="loginMsg" class="msg hidden"></div></div></section>
<main id="catalog" class="hidden"><h1>Product Catalogue</h1><div id="products" class="products"></div><div class="checkout"><h2>Order Confirmation</h2><input id="name" placeholder="Customer name"><input id="email" type="email" placeholder="Email (optional)"><div id="summary"></div><button id="orderBtn" class="full" onclick="placeOrder()">Confirm Order</button><div id="orderMsg" class="msg hidden"></div></div></main>
<footer>Hitech World • Customer Support: 8226015555</footer>
<script>
const products=[{id:1,name:"Product 1",mrp:499},{id:2,name:"Product 2",mrp:799},{id:3,name:"Product 3",mrp:999},{id:4,name:"Product 4",mrp:1499}];let cart={},customerMobile="";
function msg(id,t){let e=document.getElementById(id);e.textContent=t;e.classList.remove("hidden")}
function login(){let n=document.getElementById("mobile").value.replace(/\D/g,"");if(n.length!==10){msg("loginMsg","Please enter a valid 10-digit mobile number.");return}customerMobile=n;document.getElementById("login").classList.add("hidden");document.getElementById("catalog").classList.remove("hidden");render()}
function qty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];render()}
function render(){document.getElementById("products").innerHTML=products.map(p=>`<article class="product"><div class="icon">🛍️</div><h3>${p.name}</h3><b>MRP ₹${p.mrp}</b><div class="qty"><button onclick="qty(${p.id},-1)">−</button><b>${cart[p.id]||0}</b><button onclick="qty(${p.id},1)">+</button></div></article>`).join("");let total=0;let a=products.filter(p=>cart[p.id]).map(p=>{let x=p.mrp*cart[p.id];total+=x;return `<div class="line"><span>${p.name} × ${cart[p.id]}</span><span>₹${x}</span></div>`}).join("");document.getElementById("summary").innerHTML=a+`<div class="line"><b>Total</b><b>₹${total}</b></div>`}
async function placeOrder(){let name=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim(),items=products.filter(p=>cart[p.id]).map(p=>({name:p.name,mrp:p.mrp,qty:cart[p.id]})),total=items.reduce((s,i)=>s+i.mrp*i.qty,0);if(!name)return msg("orderMsg","Please enter customer name.");if(!items.length)return msg("orderMsg","Please select a product.");let b=document.getElementById("orderBtn");b.disabled=true;b.textContent="Sending Order...";try{let r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,email,mobile:customerMobile,items,total})}),d=await r.json();if(!r.ok)throw Error(d.error||"Order failed");msg("orderMsg","Order confirmed! Order ID: "+d.orderId);cart={};render()}catch(e){msg("orderMsg",e.message)}finally{b.disabled=false;b.textContent="Confirm Order"}}
render();
</script></body></html>
